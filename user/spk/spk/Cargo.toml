[package]
name = "spk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SpaceOS-9 package manager (target side)"

[lib]
name = "spk_ops"
path = "src/lib.rs"

[[bin]]
name = "spk"
path = "src/main.rs"

[[bin]]
name = "spk-qemu-test"
path = "src/bin/spk_qemu_test.rs"

[[bin]]
name = "spk-sandbox"
path = "src/bin/spk_sandbox.rs"

[dependencies]
spk-core = { path = "../spk-core" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rustix.workspace = true
thiserror.workspace = true
libc.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
spk-host = { path = "../spk-host" }
rcgen = "0.13"
