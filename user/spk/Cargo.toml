#       Copyright (C) 2026 ViudiraTech.
#

[workspace]
resolver = "2"
members = ["spk-core", "spk-host", "spk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ViudiraTech/SpaceKernel"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
sha2 = "0.10"
thiserror = "2.0"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
tar = { version = "0.4", default-features = false }
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }
zstd = { version = "0.14", default-features = false }
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1", features = ["fs", "process"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
tempfile = "3.13"
proptest = "1.12"
