[package]
name = "spk-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SpaceOS-9 package builder and repository signer"

[[bin]]
name = "spk-host"
path = "src/main.rs"

[lib]
name = "spk_host"
path = "src/lib.rs"

[dependencies]
spk-core = { path = "../spk-core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
base64.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
tar.workspace = true
zstd.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
