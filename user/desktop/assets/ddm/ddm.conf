# SpaceOS Display Manager (DDM)
#
# The daemon runs as root; the greeter and OOBE wizard run as GreeterUser.
# Keep GreeterUser unprivileged.  root GUI login is disabled by default.

[General]
Display = :0
Xserver = /usr/bin/Xorg
XserverArgs = -novtswitch -nolisten tcp -noreset
GreeterUser = ddm
GreeterProgram = /usr/bin/spui
GreeterArgs = greeter
OobeProgram = /usr/bin/spui
OobeArgs = oobe

SessionDir = /usr/share/xsessions
DefaultSession = spui

# Never allow uid 0 to authenticate through the graphical greeter.
AllowRoot = false
MinimumUid = 1000

# Five failures in a row lock the account name for five minutes.  The delay is
# applied even for unknown accounts to reduce user-enumeration timing leaks.
MaxFailures = 5
LockoutSeconds = 300
FailureDelayMs = 600

AllowPower = true

# Automatic login is opt-in from OOBE or the state file.  It is never enabled
# for root.
AutoLogin = false
AutoLoginUser =

Wallpaper = /usr/share/spui/wallpapers/alpine-peaks.jpg
RuntimeDir = /run/ddm
StateDir = /var/lib/ddm
LogDir = /var/log/ddm
OobeMarker = /var/lib/spaceos/oobe-complete
XorgLog = /var/log/xorg.log
