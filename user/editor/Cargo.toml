[package]
name = "space_editor"
version = "1.0.0"
edition = "2021"
description = "SpaceEditor: WYSIWYG A4 word processor for SpaceOS-9"
license = "LicenseRef-Proprietary"

[lib]
name = "space_editor"
path = "src/lib.rs"

[[bin]]
name = "space-editor"
path = "src/main.rs"

[dependencies]
spui_ui = { path = "../spui_ui" }
uxconf = { package = "spui", path = "../desktop" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
roxmltree = "0.20"
libc = "0.2"
